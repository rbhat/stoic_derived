  # ------------------------------------------------- the ~$1,000 risk figure, now cited
  risk_unit:
    finding: >
      §10.10 infers a "~$1,000 risk unit". The trader states it outright in this segment, three
      times. What he states is a MAX he sizes under, not a constant he hits — which is §10.10's own
      floor rule, n = floor(1000 / (2 x stop)), "which is why they land just under".
    quotes:
      - {video: "01:36:09", quote: "i'm just taking these setups one thousand dollar per risk for me this is my risk currently"}
      - {video: "01:29:35", quote: "one thousand dollars is locked in", refers_to: "T-A2's +1R"}
      - {video: "01:17:39", quote: "it will be about thousand dollar r[isk]", refers_to: "sizing T-A2 to 9 lots"}
    what_it_does_NOT_establish: >
      It does not say how the printed R label is computed. Two candidates fit every row in §10.10's
      table equally well — P&L divided by the round $1,000, or P&L divided by that trade's own
      actual risk — and this session cannot separate them, because both give the same printed label
      on all three trades. An earlier version of this block asserted the first. That was a mechanism
      stated without being distinguished from its alternative; see
      claude_memories/plausible-cause-is-not-a-measured-cause.md.

  # ------------------------------------------------- §10.10 stops are SUGGESTIONS, not readings
  stop_recovery:
    status: suggestion              # user's call, 2026-08-11
    governs: "every `by_r_label` field in this file, and the lot bracket below"
    why: >
      Recovering a stop from a dollar figure needs two things this repo has not tested. The risk
      unit is a maximum, not a constant, so the actual risk lands somewhere in
      (n/(n+1) x $1,000, $1,000] — up to 14% below at 6 lots. And the point value is instrument
      specific: $2/point is MNQ. NQ is $20, ES $50, MES $5. These charts are MNQ while our bars are
      NQ, so every dollar figure here is contingent on the contract as well as on the account.
    disposition: >
      Treat a `by_r_label` distance as a SUGGESTION until it is tested against a second instrument,
      never as a reading that can contradict §5.4.1 / D-18. The engine takes its stop from the PTB
      extreme (D-18) and never from a dollar figure — §5.4.2 defines R in POINTS, and §10.10 itself
      says it is "not a sizing rule". Nothing in stoic/ reads any of this.
    lot_count_bracket:
      status: suggestion            # same contingency as above — same $/point, same cap
      idea: >
        §10.10's floor rule inverts: given the lot count n, the stop distance d satisfies
        1000/(2(n+1)) < d <= 1000/(2n). That brackets a stop WITHOUT dividing by the R label, so it
        is independent of how the label is computed — which is the one question above that this
        session could not settle.
      measured_across_all_fixtures:   # pts; "out" = outside the bracket
        - {id: LT-A1,    lots: 6,  bracket: "(71.43, 83.33]", ptb_extreme: 97.75, r_label: 85.50, both: out}
