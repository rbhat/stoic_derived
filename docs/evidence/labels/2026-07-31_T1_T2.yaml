      video: "01:32:55"
      quote: "i'm just keep following the candles down until we have the candle that's ptb when it's inside candle you don't want to treat it as ptb"
      note: "Stated in as many words, live, on the trade this file labels T-B1."
    - rule: "§5.4.1 / D-18 — the stop is the PTB's opposite extreme"
      video: "01:32:30"
      quote: "i'm in stop was below the ptb low this is the ptb"
      note: >
        He says BELOW the PTB low, not AT it. T-B1's by_ptb_extreme reading is the low itself
        (28,308.50); the by_r_label reading (28,309.49) sits ABOVE it and is the one this quote
