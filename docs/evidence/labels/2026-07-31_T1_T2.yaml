  # ------------------------------------------------- how T-A2 reached +1R
  management_observed:
    finding: >
      T-A2's +1R is a discretionary stop move, not a target and not the rulebook's break-even.
      [01:26:50] "i'm gonna put my stop loss over here and then i will lock in plus one r";
      [01:28:59] "i hesitated and i moved my stop loss not the best execution here"; [01:29:35] the
      buy stop that filled at 11:50.
    why_it_matters: >
      §5.4.5 / D-25 allows exactly ONE stop move and it is to break-even, at the Step 3 extreme.
      A move to +1R is not in §1–§9. It is the trader managing discretionarily, of the same class
      as §4.3's climax and §6.5a's lower-high cue (D-26) — subjective, and it never becomes a rule.
    disposition: >
      Recorded as an observation of the material. NOT proposed as a rule and NOT given a D-row —
      claude_memories/audit-hard-rules-not-in-material.md. The consequence for Phase 6 is narrow
      and concrete: on T-A2, score the entry, the trigger and R; the EXIT is discretionary and the
      engine is not expected to reproduce it.

