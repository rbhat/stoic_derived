calibration:
  reproduce: "scripts/fit_marked_chart.py <artifact> --last-bar <screenshot bar, ET>"
  LT4: {comb_spacing_px: 21.505, price_of_y: "28584.888 - 0.28492*y",
        fitted_on: "272 candle-body ends", resid_sd_pts: 0.92, resid_max_pts: 2.95,
        first_bar: "09:40 ET", last_slot: 139}
  LT3: {comb_spacing_px: 29.985, price_of_y: "28406.218 - 0.29409*y",
        fitted_on: "178 candle-body ends", resid_sd_pts: 0.69, resid_max_pts: 2.11,
        first_bar: "08:10 ET", last_slot: 97}
  cross_check: >
    The two snapshots are at different zooms (21.5 vs 30.0 px per candle) and were fitted
    independently. The +4.5R entry arrow lands on the SAME bar — 15:55 ET — in both, which
    checks the method rather than the data. LT4's exit arrow sits on its own last, in-progress
    bar, so the screenshot was taken seconds after the close-out.
  anchor_is_measured_not_assumed: >
    The price residual discriminates a one-bar error sharply on both: LT4 gives 0.92 pts sd at
    22:15 against 16.9 / 17.4 at 22:10 / 22:20, and LT3 gives 0.69 at 16:15 against 16.4 / 19.2
    at 16:10 / 16:20. LT3's anchor is confirmed a second time, independently, by its own four
    right-axis SMA tags (below).
  script_fix: >
    fit_marked_chart.py could not resolve this fixture until 2026-08-10 — it reported 16.95 pts
    sd and the docstring read that as the CME maintenance break, which the slot count does not
    model. That was wrong. Our 5m frame holds no bars in the 17:00-18:00 ET break either, so
    walking `last_index - k` skips it correctly and needed no change. The real fault was the
    comb: four of LT4's candles draw no body pixels (dojis, and candles under the shaded
    session boxes), each leaving a two-slot gap, so the `span / median_gap` seed searched 134-138
    slots when the truth was 139 and the spacing came out 6% long. The seed now counts the gaps.
    T1/T2 reproduce unchanged under the fix.

