break_even_mark:
  drawn: "the letters `BE`, at the 10:35 / 10:40 bars in both renders"
  what_10_9_says: "drawn on the earlier +2.8R morning trade — not on the +4.5R one"
  what_the_arithmetic_says: >
    The +2.8R trade (LT34-M1) ran 09:35 → 10:05 and closed +229.00 points; the 8-lot trade
    (LT34-M2) ran 10:15 → 10:50 and closed +2.75 points, which IS break-even. The `BE` text sits
    inside LT34-M2's window, not LT34-M1's.
  what_the_narration_says: >
    RESOLVED 2026-08-10 by PTBV, which narrates this session live (docs/evidence/ptbv_session_map.md).
    At video [00:26:33], wall clock 10:23:17 AM, he says "this is a very good place to put your stop
    loss at break-even ... I'm gonna put this at the break even". LT34-M1 had already closed at
    10:06:11 ([00:23:19]), seventeen minutes earlier, and the position open at 10:23 is the one he
    entered at 10:17:43 ([00:23:38], "i gotta do market") — LT34-M2. So the break-even stop belongs
    to LT34-M2, which is what the arithmetic said and NOT what §10.9 says.
  disposition: >
    The narration settles WHICH trade; it does not rehabilitate the drawn mark. `BE` sits at the
    10:35 / 10:40 bars while the stop was moved at 10:23:17 — so the glyph's x-position is off by
    12-17 minutes and still identifies neither a trade nor an event, exactly as a count numeral
    fails to mark a bar. §10.9's attribution to the +2.8R trade is contradicted by two independent
    readings now. Reported, not corrected: editing §10 is the user's call.

