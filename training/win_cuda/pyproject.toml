[project]
name = "stoic-training"
version = "0.1.0"
description = "Reproducible Windows/WSL QLoRA training package (offline research assistant; never in the live signal path)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.11.0",
    "transformers==5.14.1",
    "peft==0.19.1",
    "trl==1.9.0",
    "bitsandbytes==0.49.2",
    "datasets==5.0.0",
    "accelerate==1.14.0",
]

[dependency-groups]
dev = [
    "pytest",
]
export = [
    "sentencepiece==0.2.1",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stoic_training"]
