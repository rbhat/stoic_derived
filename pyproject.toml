[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "stoic-derived"
version = "0.1.0"
description = "Deterministic strategy-rulebook tooling for Stoic Derived"
readme = "VISION.md"
requires-python = ">=3.14"
dependencies = [
  "cryptography>=46.0.5",
  "faster-whisper",
  "opencv-python",
  "PyYAML>=6.0.3",
  "requests",
  "scenedetect",
]

[project.scripts]
stoic-rulebook = "stoic_derived.strategy.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/stoic_derived"]

[dependency-groups]
dev = [
  "mypy>=1.19.0",
  "pytest>=9.0.2",
  "ruff>=0.15.0",
  "types-PyYAML>=6.0.12.20250915",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
xfail_strict = true

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src"]
