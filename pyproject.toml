[project]
name = "stoic-derived"
version = "0.1.0"
description = "Stoic-derived: transcribe and read the source material, use it to build an SLM that helps derive the rulebook."
readme = "VISION.md"
requires-python = ">=3.14"
dependencies = [
  "faster-whisper",
  "opencv-python",
  "pymupdf>=1.28,<2",
  "PyYAML>=6.0.3",
  "requests",
  "scenedetect",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
  "mypy>=1.19.0",
  "pytest>=9.0.2",
  "ruff>=0.15.0",
  "types-PyYAML>=6.0.12.20250915",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
